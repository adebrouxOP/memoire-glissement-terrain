<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Mémoire - Glissements de terrain</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var map = L.map('map').setView([45.55, 6.35], 10);

var osm = L.tileLayer(
    'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        maxZoom: 18,
        attribution: '© OpenStreetMap'
    }
);

osm.addTo(map);

var fsRunul = L.tileLayer(
    'layers/FS_runul_73/{z}/{x}/{y}.png',
    {
        opacity: 0.7
    }
);

var fsRumax = L.tileLayer(
    'layers/FS_rumax_73/{z}/{x}/{y}.png',
    {
        opacity: 0.7
    }
);

var fsTrigrs10mmh24h = L.tileLayer(
    'layers/FS_TRIGRS_10mmh24h/{z}/{x}/{y}.png',
    {
        opacity: 1
    }
);

fsRunul.addTo(map);

var baseMaps = {
    "OpenStreetMap": osm
};

var overlayMaps = {
    "Facteur de sécurité en configuration sèche et bâtiments impactés": fsRunul,
    "Facteur de sécurité en configuration saturée et bâtiments impactés": fsRumax,
    "Facteur de sécurité après scénario de précipitations de 10mm/h pendant 24h et bâtiments" : fsTrigrs10mmh24h
};

L.control.layers(baseMaps, overlayMaps).addTo(map);

</script>
</body>
</html>
